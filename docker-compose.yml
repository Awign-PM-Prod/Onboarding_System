services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8089:8089"
    restart: unless-stopped
    healthcheck:
      # node:20-alpine has no wget; use built-in fetch (Node 18+)
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8089/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    build:
      # Repo root so Vite can resolve `@obs/backend` → backend/src during `npm run build`.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Interpolated from repo-root `.env` or your shell — NOT from `frontend/.env`.
        # Empty API base = same-origin `/api/...` (nginx → backend on Docker network).
        # Production domain: https://staffing-portal.awignhub.in (ALB → :8088).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:8088"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
